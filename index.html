<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Dukan</title>
<meta name="theme-color" content="#0F2A22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dukan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --ink:#0F2A22; --page:#E7EDE8; --card:#FFFFFF;
  --green:#006233; --green-soft:#E3F0E7;
  --red:#B3111F; --red-soft:#FBE7E8;
  --amber:#A66A00; --amber-soft:#FCF0D9;
  --muted:#5F6F67; --line:#D5DED7; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--page);color:var(--ink);
  font-family:-apple-system,"SF Arabic","Geeza Pro","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
input,select{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus,select:focus{border-color:var(--green)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;display:inline-block}

#app{padding:0 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
header.top{position:sticky;top:0;z-index:20;background:var(--page);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
header.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}
header.top p{margin:2px 0 0;font-size:13px;color:var(--muted)}

.pulse{background:var(--ink);color:#fff;border-radius:18px;padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0 14px}
.pulse div{text-align:center}
.pulse b{display:block;font-size:20px;font-weight:700;letter-spacing:-.5px}
.pulse span{font-size:12px;opacity:.72}
.pulse .sep{border-left:1px solid rgba(255,255,255,.16);border-right:1px solid rgba(255,255,255,.16)}

.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}

.btn{background:var(--green);color:#fff;border-radius:12px;padding:13px 16px;font-weight:600;text-align:center;display:block;width:100%}
.btn:active{opacity:.85}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.icobtn{width:48px;height:48px;flex:0 0 48px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;font-size:20px}
.icobtn.solid{background:var(--ink);border-color:var(--ink);color:#fff}

.item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.thumb{flex:0 0 46px;width:46px;height:46px;border-radius:11px;background:var(--page);object-fit:cover;display:grid;place-items:center;font-size:19px;color:var(--muted);overflow:hidden}
img.thumb{display:block}
.qty{flex:0 0 auto;min-width:52px;text-align:center;border-radius:10px;padding:6px 8px;font-weight:700;font-size:15px;background:var(--green-soft);color:var(--green)}
.qty.low{background:var(--amber-soft);color:var(--amber)}
.qty.out{background:var(--red-soft);color:var(--red)}
.end{text-align:end}

.chips{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

#cartbar{position:fixed;right:0;left:0;bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;padding:0 14px;max-width:640px;margin:0 auto}
#cartbar .inner{background:var(--green);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(15,42,34,.28)}
#cartbar b{font-size:17px}
#cartbar small{opacity:.8;font-size:12px;display:block}

nav.tabs{position:fixed;right:0;left:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.6) blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{padding:9px 0 7px;color:var(--muted);font-size:11px;font-weight:600;display:grid;gap:2px;justify-items:center}
nav.tabs button .g{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--green)}

.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(15,42,34,.45)}
.sheet{position:absolute;right:0;left:0;bottom:0;background:var(--page);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;max-width:640px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:2px 0 14px;font-size:18px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
label.f{display:block;margin-bottom:11px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.photobox{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.photobox .pv{width:88px;height:88px;flex:0 0 88px;border-radius:14px;background:var(--card);border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;font-size:26px;color:var(--muted)}
.photobox .pv img{width:100%;height:100%;object-fit:cover}

#scan{position:fixed;inset:0;z-index:80;background:#000;display:none}
#scan.open{display:block}
#scan video{width:100%;height:100%;object-fit:cover}
#scan .frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:76%;max-width:320px;aspect-ratio:1.6;border:2px solid #fff;border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.5)}
#scan .close{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:14px;background:rgba(255,255,255,.92);color:#000;border-radius:999px;padding:9px 18px;font-weight:600}
#scan .hint{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));right:0;left:0;text-align:center;color:#fff;font-size:14px;padding:0 24px}

#toast{position:fixed;bottom:calc(130px + env(safe-area-inset-bottom));right:14px;left:14px;z-index:90;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;text-align:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:612px;margin:0 auto}
#toast.show{opacity:1}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
</style>
</head>
<body>

<div id="app"></div>

<div id="cartbar" hidden>
  <div class="inner">
    <button class="grow" style="text-align:start;color:#fff" onclick="openCart()">
      <b><span id="cartN" class="num">0</span> <span id="cartL"></span></b>
      <small id="cartH"></small>
    </button>
    <button onclick="finishSale()" style="background:#fff;color:var(--green);border-radius:11px;padding:11px 16px;font-weight:700">
      <span id="cartB"></span> <span id="cartT" class="num">0</span>
    </button>
  </div>
</div>

<nav class="tabs">
  <button data-tab="sell" onclick="go('sell')"><span class="g">🧾</span><span data-t="tSell"></span></button>
  <button data-tab="stock" onclick="go('stock')"><span class="g">📦</span><span data-t="tStock"></span></button>
  <button data-tab="rep" onclick="go('rep')"><span class="g">📊</span><span data-t="tRep"></span></button>
  <button data-tab="set" onclick="go('set')"><span class="g">⚙️</span><span data-t="tSet"></span></button>
</nav>

<div class="sheet-wrap" id="sheetWrap">
  <div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"></div>
</div>

<div id="scan">
  <video id="scanVid" playsinline muted></video>
  <div class="frame"></div>
  <button class="close" onclick="stopScan()" id="scanClose"></button>
  <p class="hint" id="scanHint"></p>
</div>

<div id="toast"></div>
<input type="file" id="photoIn" accept="image/*" style="display:none">

let L='ar';
const t=k=>T[L][k]??k;

/* ================= storage ================= */
if(!window.structuredClone) window.structuredClone=o=>JSON.parse(JSON.stringify(o));
const KEY='dukkan.v1';
const blank={store:{name:'',lang:'ar'},products:[],sales:[],seq:1};
let db;
try{ db=JSON.parse(localStorage.getItem(KEY))||structuredClone(blank); }
catch(e){ db=structuredClone(blank); }
for(const k in blank) if(db[k]===undefined) db[k]=structuredClone(blank[k]);
L = db.store.lang || 'ar';
if(!db.store.name) db.store.name = T[L].shop;

let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,120);
}
function flush(){
  try{ localStorage.setItem(KEY,JSON.stringify(db)); }
  catch(e){ toast(t('noSave')); }
}
const uid=()=>(db.seq++).toString(36)+Date.now().toString(36).slice(-4);

/* photos live in IndexedDB (localStorage is far too small for images) */
let PH={}, idb=null;
function openIDB(){
  return new Promise(res=>{
    if(!window.indexedDB) return res(null);
    const r=indexedDB.open('dukkan-photos',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('p');
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>res(null);
  });
}
function idbAll(){
  return new Promise(res=>{
    if(!idb) return res({});
    const tx=idb.transaction('p','readonly').objectStore('p'), out={};
    const c=tx.openCursor();
    c.onsuccess=e=>{const cur=e.target.result; if(!cur) return res(out); out[cur.key]=cur.value; cur.continue();};
    c.onerror=()=>res({});
  });
}
function idbPut(k,v){ PH[k]=v; if(idb) idb.transaction('p','readwrite').objectStore('p').put(v,k); }
function idbDel(k){ delete PH[k]; if(idb) idb.transaction('p','readwrite').objectStore('p').delete(k); }

const money=n=>Math.round(n||0).toLocaleString('en-US').replace(/,/g,'\u202F');

function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2100);}
const dayStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime();};
const fmtDate=ts=>new Date(ts).toLocaleString(t('loc'),{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

function stockState(p){ if(p.qty<=0) return 'out'; if(p.qty<=(p.min||0)) return 'low'; return 'ok'; }
function thumb(p){

function findProducts(q){
  q=(q||'').trim().toLowerCase();
  const all=db.products.slice().sort((a,b)=>a.name.localeCompare(b.name,t('loc')));
  return q? all.filter(p=>p.name.toLowerCase().includes(q)||(p.barcode||'').includes(q)) : all;
}
function totals(from){
  let rev=0,prof=0,n=0;
  for(const s of db.sales){ if(from&&s.ts<from) continue; rev+=s.total; prof+=s.profit; n++; }
  return {rev,prof,n};

function addToCart(id){
  const p=db.products.find(x=>x.id===id); if(!p) return;
  const line=cart.find(i=>i.id===id);
  if(line){ if(line.qty>=p.qty){ toast(t('notEnough')); return; } line.qty++; }
  else cart.push({id,name:p.name,price:p.price,cost:p.cost,qty:1});
  toast(p.name+' '+t('toCart'));
  render();
}
function openCart(){
  sheet(`<h2>${t('cart')}</h2>
   <div class="card">${cart.map((i,ix)=>`
     <div class="item">
       <div class="grow"><div class="nm">${esc(i.name)}</div>
         <div class="sub"><span class="num">${money(i.price)}</span> ${CUR()} / ${t('perUnit')}</div></div>
       <button class="icobtn" onclick="bump(${ix},-1)">−</button>
       <b class="num" style="min-width:26px;text-align:center">${i.qty}</b>
       <button class="icobtn" onclick="bump(${ix},1)">+</button>
     </div>`).join('')||`<div class="empty">${t('emptyCart')}</div>`}
   </div>
   <div class="card row"><b class="grow">${t('total')}</b><b class="num" style="font-size:19px">${money(cartTotal())} ${CUR()}</b></div>
   <button class="btn" onclick="finishSale()">${t('recordSale')}</button>
   <button class="btn ghost" style="margin-top:8px" onclick="cart=[];closeSheet();render()">${t('clearCart')}</button>`);
}
function bump(ix,d){
  const i=cart[ix], p=db.products.find(x=>x.id===i.id);
  i.qty+=d;
  if(p&&i.qty>p.qty){ i.qty=p.qty; toast(t('notEnough')); }
  if(i.qty<=0) cart.splice(ix,1);
  render(); cart.length?openCart():closeSheet();
}
function finishSale(){
  if(!cart.length) return;
  const items=cart.map(i=>({pid:i.id,name:i.name,qty:i.qty,price:i.price,cost:i.cost}));
  const total=items.reduce((a,i)=>a+i.price*i.qty,0);
  const profit=items.reduce((a,i)=>a+(i.price-(i.cost||0))*i.qty,0);
  db.sales.unshift({id:uid(),ts:Date.now(),items,total,profit});
  for(const i of items){ const p=db.products.find(x=>x.id===i.pid); if(p) p.qty=Math.max(0,p.qty-i.qty); }
  cart=[]; save(); closeSheet(); render();
  toast(`${t('saleDone')} · ${money(total)} ${CUR()} · ${t('profit')} ${money(profit)}`);
}

/* shrink to ~400px JPEG so a few hundred photos still fit comfortably */
function shrink(file){
  return new Promise(res=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const M=400, r=Math.min(1,M/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.62));
    };
    img.onerror=()=>res(null);
    img.src=url;
  });
}
function saveProduct(){

  if(draftPhoto) idbPut(pid,draftPhoto); else idbDel(pid);
  draftPhoto=null;
  save(); closeSheet(); render(); toast(t('saved'));
}

function download(obj,name){
  const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const stamp=()=>new Date().toISOString().slice(0,10);
function exportAll(withPhotos){
  flush();
  download(withPhotos?{...db,photos:PH}:db, `dukan-backup-${stamp()}.json`);
  toast(t('saved'));
}
function importAll(inp){
  const f=inp.files[0]; if(!f) return; inp.value='';
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.products)) throw 0;
      if(!confirm(t('confirmReplace'))) return;
      const ph=d.photos||null; delete d.photos;
      db=Object.assign(structuredClone(blank),d);
      if(ph){ idbClear(); for(const k in ph) idbPut(k,ph[k]); }
      L=db.store.lang||L; applyDir(); flush(); render(); toast(t('restored'));
    }catch(e){ toast(t('invalid')); }
  };
  r.readAsText(f);
}
/* the editable list: plain, readable, no ids required */
function exportProducts(){
  download(db.products.map(p=>({
    name:p.name, barcode:p.barcode||'', cost:p.cost, price:p.price, qty:p.qty, min:p.min
  })), `dukan-products-${stamp()}.json`);
  toast(t('saved'));
}
function importProducts(inp){
  const f=inp.files[0]; if(!f) return; inp.value='';
  const r=new FileReader();
  r.onload=()=>{
    try{
      const rows=JSON.parse(r.result);
      if(!Array.isArray(rows)) throw 0;
      let add=0,upd=0;
      for(const row of rows){
        const name=String(row.name||'').trim(); if(!name) continue;
        const bc=String(row.barcode||'').trim();
        const num=(v,d=0)=>{const x=parseFloat(v); return isNaN(x)?d:Math.max(0,x);};
        const found=db.products.find(p=>(bc&&p.barcode===bc)||p.name===name);
        const data={name,barcode:bc,cost:num(row.cost),price:num(row.price),
                    qty:Math.round(num(row.qty)),min:Math.round(num(row.min,3))};
        if(found){ Object.assign(found,data); upd++; }
        else { db.products.push({id:uid(),...data}); add++; }
      }
      flush(); render(); toast(`${t('merged')} · +${add} / ↻${upd}`);
    }catch(e){ toast(t('invalid')); }
  };
  r.readAsText(f);
}
function wipe(){
  if(!confirm(t('confirmWipe'))) return;
  if(!confirm(t('confirmWipe2'))) return;
  const lang=L;
  db=structuredClone(blank); db.store.lang=lang; db.store.name=T[lang].shop;
  cart=[]; idbClear(); flush(); render(); toast(t('wiped'));
}

/* ================= sheet ================= */
function sheet(h){ $('#sheet').innerHTML='<div class="grab"></div>'+h; $('#sheetWrap').classList.add('open'); }
function closeSheet(){ $('#sheetWrap').classList.remove('open'); draftPhoto=null; }

/* ================= scanner ================= */
let scanTarget=null, scanStream=null, zx=null, rafId=null;
async function scanFor(target){
  scanTarget=target;
  $('#scan').classList.add('open');
  $('#scanHint').textContent=t('camOpening');
  try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector();
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      const v=$('#scanVid'); v.srcObject=scanStream; await v.play();
      $('#scanHint').textContent=t('camAim');
      const loop=async()=>{
        if(!scanStream) return;
        try{ const r=await det.detect(v); if(r.length) return onCode(r[0].rawValue); }catch(e){}
        rafId=requestAnimationFrame(loop);
      };
      loop();
    }else{
      await loadZX();
      zx=new ZXing.BrowserMultiFormatReader();
      $('#scanHint').textContent=t('camAim');
      zx.decodeFromVideoDevice(undefined,'scanVid',r=>{ if(r) onCode(r.getText()); });
    }
  }catch(e){ $('#scanHint').textContent=t('camFail'); }
}
function loadZX(){
  if(window.ZXing) return Promise.resolve();
  return new Promise((ok,no)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=ok; s.onerror=()=>no(new Error('offline'));
    document.head.appendChild(s);
  });
}
function stopScan(){
  cancelAnimationFrame(rafId);
  if(zx){ try{zx.reset();}catch(e){} zx=null; }
  if(scanStream){ scanStream.getTracks().forEach(x=>x.stop()); scanStream=null; }
  $('#scanVid').srcObject=null;
  $('#scan').classList.remove('open');
}
function onCode(code){
  if(navigator.vibrate) navigator.vibrate(40);
  stopScan();
  const p=db.products.find(x=>x.barcode===code);
  if(scanTarget==='field'){ const el=$('#pb'); if(el) el.value=code; return; }
  if(scanTarget==='sell'){
    if(!p) return toast(t('unknownBc'));
    if(p.qty<=0) return toast(p.name+' — '+t('outStock'));
    return addToCart(p.id);
  }
  if(p) editProduct(p.id);
  else { editProduct(); setTimeout(()=>{const el=$('#pb'); if(el) el.value=code;},100); toast(t('newBc')); }
}

/* ================= boot ================= */
(async()=>{
  idb=await openIDB();
  PH=await idbAll();
  applyDir(); render();
})();
window.addEventListener('beforeunload',()=>{ clearTimeout(saveTimer); flush(); });
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
